<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarang Saree Admin</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#faf3ee;color:#55233c;margin:0;padding:20px}main{max-width:1100px;margin:25px auto}.panel{background:white;border:1px solid #ead5dc;border-radius:18px;padding:25px;margin-bottom:20px}h1,h2{font-family:Georgia,serif}input{padding:12px;border:1px solid #c7adb8;border-radius:8px;font:inherit}button,a.button{background:#692142;color:white;border:0;border-radius:8px;padding:12px 20px;margin:8px 5px 8px 0;cursor:pointer;text-decoration:none;display:inline-block}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eee;padding:12px 8px;text-align:left}th{background:#f5e8ed}.scroll{overflow:auto}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:18px;background:#f8eef2;border-radius:10px;min-width:170px}.stat b{font-size:26px;display:block}.hide{display:none}.warn{padding:12px;background:#fff2de;color:#744720;border-radius:9px}#error{color:#b22}</style></head><body><main><h1>Tarang Saree · Admin Portal</h1><p class="warn">Instagram followers are NOT verified. Issued coupons are based on customer self-confirmation.</p><section class="panel" id="login"><h2>Admin Sign In</h2><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button type="submit">Sign In</button></form></section><section id="dashboard" class="hide"><div class="panel"><button id="refresh">Refresh Records</button><a href="/api/admin-export" class="button">Download CSV</a><button id="logout">Log out</button><div class="stats" id="stats"></div></div><div class="panel"><h2>Registrations</h2><input id="search" type="search" placeholder="Search name, mobile, token or coupon"><div class="scroll"><table><thead><tr><th>Coupon</th><th>Name</th><th>Mobile</th><th>DM Token</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><p id="error" role="status"></p></main><script>
const $=x=>document.getElementById(x);let records=[];const td=(tr,v)=>{const c=document.createElement('td');c.textContent=v??'—';tr.appendChild(c)};async function call(action,options={}){const r=await fetch('/api/'+action,{...options,headers:options.body?{'Content-Type':'application/json'}:{}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function table(){const term=$('search').value.toLowerCase();$('rows').replaceChildren();for(const r of records.filter(r=>[r.name,r.phone,r.token,r.coupon].some(v=>String(v||'').toLowerCase().includes(term)))){const tr=document.createElement('tr');[r.coupon,r.name,r.phone,r.token,r.status,r.registeredAt].forEach(v=>td(tr,v));$('rows').appendChild(tr)}}async function load(){const d=await call('admin-data');records=d.records;$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('stats').replaceChildren();const items=[['Registered',records.length],['Coupons issued',records.filter(r=>r.coupon).length],['Pending',records.filter(r=>!r.coupon).length],['Next number',d.nextCoupon]];for(const [label,value] of items){const div=document.createElement('div');div.className='stat';const b=document.createElement('b');b.textContent=value;div.append(b,document.createTextNode(label));$('stats').appendChild(div)}table()}
$('form').onsubmit=async e=>{e.preventDefault();try{await call('admin-login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await load();$('error').textContent=''}catch(x){$('error').textContent=x.message}};$('refresh').onclick=()=>load().catch(e=>$('error').textContent=e.message);$('search').oninput=table;$('logout').onclick=async()=>{await call('admin-logout',{method:'POST',body:'{}'});location.reload()};load().catch(()=>{});
</script></body></html>
